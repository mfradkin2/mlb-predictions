name: Refresh Sports Predictions

on:
  schedule:
    # Every hour on the hour.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of past schedule to re-fetch (raise for a one-off backfill)'
        required: false
        default: ''
      skip_props:
        description: 'Skip the player-statistics fetch'
        type: boolean
        required: false
        default: false

# Never let two refreshes race each other onto the same branch.
concurrency:
  group: refresh-predictions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Ingest: R pulls standings and schedules from ESPN ─────────────────
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Install system dependencies for R
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r43-${{ hashFiles('.github/workflows/update.yml') }}
          restore-keys: ${{ runner.os }}-r43-

      - name: Install R packages
        run: |
          Rscript -e 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/latest")); \
                      need <- setdiff(c("httr","jsonlite","dplyr"), rownames(installed.packages())); \
                      if (length(need)) install.packages(need)'
          Rscript -e 'for (p in c("httr","jsonlite","dplyr")) if (!requireNamespace(p, quietly = TRUE)) stop("Failed to install ", p)'

      # One league failing (off-season, an ESPN hiccup) must not stop the rest.
      - name: Fetch MLB
        run: Rscript generate_mlb_predictions.R
        continue-on-error: true
        env:
          SP_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}

      - name: Fetch NHL
        run: Rscript generate_nhl_predictions.R
        continue-on-error: true
        env:
          SP_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}

      - name: Fetch NBA
        run: Rscript generate_nba_predictions.R
        continue-on-error: true
        env:
          SP_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}

      - name: Fetch NFL
        run: Rscript generate_nfl_predictions.R
        continue-on-error: true
        env:
          SP_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}

      # ── Model, props and site build ───────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Train models, project props and rebuild the site
        run: |
          python3 run_pipeline.py ${{ github.event.inputs.skip_props == 'true' && '--no-props' || '' }}

      # ── Publish ───────────────────────────────────────────────────────────
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            index.html mlb.html nhl.html nba.html nfl.html \
            assets data history model_state \
            mlb_predictions.csv \
            nhl_2026_schedule_enriched.csv \
            nba_2026_schedule_enriched.csv \
            nfl_2026_schedule_enriched.csv
          if git diff --cached --quiet; then
            echo "Nothing changed this run."
            exit 0
          fi
          git commit -m "Auto-refresh: predictions and player props $(date -u +'%Y-%m-%d %H:%M UTC')"
          # The hourly schedule can collide with a push; rebase and retry.
          for attempt in 1 2 3 4; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on origin."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          echo "Could not push after 4 attempts." >&2
          exit 1
